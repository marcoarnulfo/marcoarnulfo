<svg xmlns="http://www.w3.org/2000/svg" width="880" height="236" viewBox="0 0 880 236">
  <style>
    .k { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2px; fill: #b5b2a8; }
    .big { font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0eee6; }
    .acc { fill: #e08b6d; }
    .sub { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8f8b81; }
    .name { font: 500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #f0eee6; }
    .num { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #e08b6d; }
    .dim { font: 400 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #8f8b81; }
    .stat { font: 700 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0eee6; }
    .chip { font: 400 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #d6d3ca; }
    .group { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: #e08b6d; }
  </style>
  <rect width="880" height="236" rx="6" fill="#1f1e1d"/>
  <rect x="0.5" y="0.5" width="879" height="235" rx="6" fill="none" stroke="#3a3833"/>
  <rect x="40" y="34" width="8" height="8" fill="#d97757"/>
  <text x="58" y="42" class="k">ABOUT ME</text>
  <defs><clipPath id="p"><rect x="48" y="74" width="116" height="116" rx="3"/></clipPath></defs>
  <image href="data:image/jpeg;base64," x="48" y="74" width="116" height="116" clip-path="url(#p)"/>
  <path d="M40 82V66H56" fill="none" stroke="#d97757" stroke-width="2"/>
  <path d="M156 66H172V82" fill="none" stroke="#d97757" stroke-width="2"/>
  <path d="M40 182V198H56" fill="none" stroke="#d97757" stroke-width="2"/>
  <path d="M156 198H172V182" fill="none" stroke="#d97757" stroke-width="2"/>
  <text x="212" y="96" class="big">Hi, I'm <tspan class="acc">Marco Arnulfo</tspan></text>
  <text x="212" y="128" class="sub">I build web and mobile applications, from the backend to the release:</text>
  <text x="212" y="150" class="sub">React and Next.js on the web, React Native and Expo on mobile,</text>
  <text x="212" y="172" class="sub">Node.js and NestJS behind them, and the cloud they run on.</text>
  <text x="212" y="194" class="sub">I also contribute to <tspan style="fill:#f0eee6;font-weight:600">ArtCraft</tspan>, open source creative apps written in Rust.</text>
</svg>
