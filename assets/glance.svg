<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200">
  <style>
    .k { font: 500 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2px; fill: #b5b2a8; }
    .big { font: 700 30px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0eee6; }
    .acc { fill: #e08b6d; }
    .sub { font: 400 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8f8b81; }
    .name { font: 500 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #f0eee6; }
    .num { font: 600 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #e08b6d; }
    .dim { font: 400 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #8f8b81; }
    .stat { font: 700 40px -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #f0eee6; }
    .chip { font: 400 12px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #d6d3ca; }
    .group { font: 600 11px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 1.5px; fill: #e08b6d; }
  </style>
  <rect width="880" height="200" rx="6" fill="#1f1e1d"/>
  <rect x="0.5" y="0.5" width="879" height="199" rx="6" fill="none" stroke="#3a3833"/>
  <rect x="40" y="34" width="8" height="8" fill="#d97757"/>
  <text x="58" y="42" class="k">AT A GLANCE</text>
  <rect x="40" y="64" width="191" height="112" rx="3" fill="#262624" stroke="#3a3833"/><text x="54" y="88" class="k" style="letter-spacing:1.2px;font-size:10px"><tspan class="acc">&gt;</tspan> YEARS AS A DEVELOPER</text><text x="54" y="138" class="stat">04</text><text x="54" y="162" class="dim">since May 2022</text>
  <rect x="243" y="64" width="191" height="112" rx="3" fill="#262624" stroke="#3a3833"/><text x="257" y="88" class="k" style="letter-spacing:1.2px;font-size:10px"><tspan class="acc">&gt;</tspan> MERGED PRS · ARTCRAFT</text><text x="257" y="138" class="stat" style="fill:#e08b6d">442</text><text x="257" y="162" class="dim">across 13 apps</text>
  <rect x="446" y="64" width="191" height="112" rx="3" fill="#262624" stroke="#3a3833"/><text x="460" y="88" class="k" style="letter-spacing:1.2px;font-size:10px"><tspan class="acc">&gt;</tspan> STARS ON THOSE APPS</text><text x="460" y="138" class="stat" style="fill:#e08b6d">174k</text><text x="460" y="162" class="dim">on GitHub</text>
  <rect x="649" y="64" width="191" height="112" rx="3" fill="#262624" stroke="#3a3833"/><text x="663" y="88" class="k" style="letter-spacing:1.2px;font-size:10px"><tspan class="acc">&gt;</tspan> APPS I CONTRIBUTE TO</text><text x="663" y="138" class="stat">13</text><text x="663" y="162" class="dim">written in Rust</text>
</svg>
